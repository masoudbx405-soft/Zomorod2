name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # بازسازی فایل .env از secrets یا fallback به .env.example
      - name: Write .env from secrets
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          fi
          if [ -n "${{ secrets.DRIVER_API_KEY }}" ]; then
            echo "DRIVER_API_KEY=${{ secrets.DRIVER_API_KEY }}" >> .env
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      # بازسازی خودکار debug.keystore از روی debug.keystore.base64
      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      # اگر secret کیستور اختصاصی Release ست شده بود، آن را بازسازی کن
      - name: Decode signing keystore
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: Clean up sensitive files
        if: always()
        run: rm -f my-upload-key.jks debug.keystore .env

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zomorod-driver-release
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
